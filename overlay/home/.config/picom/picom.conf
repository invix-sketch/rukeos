# rukeOS animations: Reduced (fades only, no zoom or heavy shadows)
backend = "xrender";
vsync = false;
use-damage = false;
shadow = false;
corner-radius = 0;
fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
fade-delta = 10;
detect-client-opacity = true;
wintypes: {
  tooltip = { fade = true; };
  dropdown_menu = { fade = true; };
  popup_menu = { fade = true; };
  notification = { fade = true; };
  dock = { fade = false; };
  desktop = { fade = false; };
};
