backend = "xrender";
vsync = false;
use-damage = false;   # full repaints: avoids stale-window glitches with xrender
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [ "_GTK_FRAME_EXTENTS@" ];
corner-radius = 12;
rounded-corners-exclude = [ "window_type = 'desktop'", "window_type = 'tooltip'" ];
fading = false;
detect-client-opacity = true;
detect-rounded-corners = true;
wintypes: {
  tooltip = { shadow = false; };
  dnd = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
