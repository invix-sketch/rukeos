# rukeOS animations: On (short, light, xrender-friendly)
backend = "xrender";
vsync = false;
use-damage = false;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.30;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [ "_GTK_FRAME_EXTENTS@", "window_type = 'desktop'", "class_g = 'Pcmanfm' && window_type = 'desktop'", "class_g = 'RukeDock'" ];
corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'desktop'", "window_type = 'tooltip'", "window_type = 'dock'", "class_g = 'RukeDock'" ];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
no-fading-destroyed-argb = false;
detect-client-opacity = true;
detect-rounded-corners = true;
wintypes: {
  tooltip = { shadow = false; fade = true; };
  dnd = { shadow = false; };
  dropdown_menu = { shadow = false; fade = true; };
  popup_menu = { shadow = false; fade = true; };
  utility = { shadow = false; fade = true; };
  notification = { shadow = true; fade = true; };
  dock = { shadow = false; fade = false; };
  desktop = { shadow = false; fade = false; };
};
# picom 12+ window animations (ignored on older builds)
animations = (
  { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.14; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.11; },
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.14; }
);
