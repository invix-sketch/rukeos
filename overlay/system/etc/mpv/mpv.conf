# rukeOS mpv — dark Tokyo Night, purple accent, light on RAM. Builtin OSC only (no uosc).
osc=yes
keep-open=yes
hwdec=auto-safe
vo=gpu,x11
profile=fast
cache=yes
demuxer-max-bytes=32MiB
demuxer-max-back-bytes=16MiB
demuxer-readahead-secs=8
audio-buffer=0.2
osd-font="Inter"
osd-font-size=28
osd-color="#C0CAF5"
osd-border-color="#1A1B26"
osd-bar=yes
osd-bar-w=80
osd-bar-h=2.5
osd-bar-align-y=0.92
background=color
background-color="#1A1B26"
title="rukeOS – ${media-title}"
stop-screensaver=yes
cursor-autohide=1000
script-opts=osc-layout=bottombar,osc-hidetimeout=2000,osc-visibility=auto,osc-boxalpha=160,osc-seekbarstyle=bar,osc-deadzonesize=0.5
